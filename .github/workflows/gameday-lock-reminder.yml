name: Game Day Lock Reminder

on:
  schedule:
    # Run well before kickoff; actual game dates handle DST and unusual game days.
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Optional reminder note'
        required: false
        default: ''

concurrency:
  group: gameday-lock-reminder
  cancel-in-progress: false

jobs:
  lock-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Remind only for upcoming games not already covered
        uses: actions/github-script@v7
        env:
          REMINDER_NOTE: ${{ inputs.window }}
        with:
          script: |
            const { runReminder } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/gameday_reminder.mjs`);
            await runReminder({ github, context, note: process.env.REMINDER_NOTE });
